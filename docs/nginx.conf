user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        server_name fftdsh.com;
        root /var/www/html;
        index index.html;
        autoindex off;

        # 全局放宽请求体上限（默认 1MB，音频上传需要更大）
        client_max_body_size 30m;

        # 精确匹配 favicon
        location = /favicon.ico {
            try_files /favicon.ico =204;
            access_log off;
            log_not_found off;
            expires 30d;
        }

        # ListenToMe：/ltm 指向本机 Node 服务（127.0.0.1:3000）
        # 必须 ^~：否则下方静态文件正则会抢走 /ltm/app.js 等请求
        location = /ltm {
            return 301 /ltm/;
        }
        location ^~ /ltm/ {
            # 末尾的 / 会剥掉 /ltm 前缀：/ltm/api/x -> /api/x
            proxy_pass http://127.0.0.1:9980/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 音频上传上限（对齐服务端 multer 的 30MB）
            client_max_body_size 30m;
            # 转写 + LLM 分析耗时较长
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 处理静态资源
        location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 
        location / {
            try_files $uri $uri/ /index.html;
        }

        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/fftdsh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fftdsh.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }

    server {
        if ($host = fftdsh.com) {
            return 301 https://$host$request_uri;
        }
        listen 80;
        server_name fftdsh.com;
        return 404;
    }
}
